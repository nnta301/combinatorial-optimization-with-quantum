<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="serif" font-size="13">
  <rect width="560" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker>
  </defs>
  <!-- quantum machine -->
  <rect x="30" y="20" width="500" height="120" rx="10" fill="#e6f2e0" stroke="#000"/>
  <text x="110" y="36" text-anchor="middle" font-style="italic">j = 1</text>
  <text x="300" y="36" text-anchor="middle" font-style="italic">j = 2</text>
  <text x="470" y="36" text-anchor="middle" font-style="italic">j = p</text>
  <line x1="215" y1="24" x2="215" y2="136" stroke="#000" stroke-dasharray="3 3"/>
  <line x1="395" y1="24" x2="395" y2="136" stroke="#000" stroke-dasharray="3 3"/>
  <g font-size="12">
    <text x="42" y="68">|0⟩</text><text x="42" y="84">|0⟩</text><text x="42" y="100">|0⟩</text><text x="42" y="116">|0⟩</text>
  </g>
  <rect x="72" y="52" width="26" height="72" rx="13" fill="#fff" stroke="#000"/>
  <text x="85" y="92" text-anchor="middle">H</text>
  <rect x="115" y="48" width="42" height="80" fill="#ffb8b8" stroke="#000"/>
  <text x="136" y="94" text-anchor="middle" font-size="11">U(H_P, γ₁)</text>
  <rect x="163" y="48" width="42" height="80" fill="#fff6b0" stroke="#000"/>
  <text x="184" y="94" text-anchor="middle" font-size="11">U(H_M, β₁)</text>
  <rect x="235" y="48" width="42" height="80" fill="#ffb8b8" stroke="#000"/>
  <text x="256" y="94" text-anchor="middle" font-size="11">U(H_P, γ₂)</text>
  <rect x="283" y="48" width="42" height="80" fill="#fff6b0" stroke="#000"/>
  <text x="304" y="94" text-anchor="middle" font-size="11">U(H_M, β₂)</text>
  <text x="450" y="94" text-anchor="middle" font-size="20">· · ·</text>
  <!-- arrows -->
  <line x1="150" y1="212" x2="150" y2="146" stroke="#000" marker-end="url(#a)"/>
  <text x="130" y="190" text-anchor="end">③</text>
  <line x1="270" y1="146" x2="270" y2="212" stroke="#000" marker-end="url(#a)"/>
  <text x="285" y="190">①</text>
  <!-- classical machine -->
  <rect x="30" y="215" width="500" height="55" rx="10" fill="#e3e9f7" stroke="#000"/>
  <rect x="45" y="225" width="200" height="35" rx="6" fill="#fff" stroke="#000"/>
  <text x="145" y="240" text-anchor="middle" font-size="12">Siêu tham số γⱼ, βⱼ</text>
  <text x="145" y="254" text-anchor="middle" font-size="12">tối ưu, j = 1 … p</text>
  <rect x="335" y="225" width="185" height="35" rx="6" fill="#fff" stroke="#000"/>
  <text x="427" y="240" text-anchor="middle" font-size="12">Tính giá trị kỳ vọng</text>
  <text x="427" y="254" text-anchor="middle" font-size="12">⟨ψ(γ,β)|H_P|ψ(γ,β)⟩</text>
  <line x1="333" y1="242" x2="247" y2="242" stroke="#000" marker-end="url(#a)"/>
  <text x="290" y="236" text-anchor="middle">②</text>
  <!-- legend -->
  <rect x="30" y="278" width="12" height="12" fill="#e6f2e0" stroke="#000"/><text x="48" y="289" font-size="11">Máy lượng tử</text>
  <rect x="140" y="278" width="12" height="12" fill="#e3e9f7" stroke="#000"/><text x="158" y="289" font-size="11">Máy cổ điển</text>
  <rect x="250" y="278" width="12" height="12" fill="#ffb8b8" stroke="#000"/><text x="268" y="289" font-size="11">Unitary của bài toán</text>
  <rect x="400" y="278" width="12" height="12" fill="#fff6b0" stroke="#000"/><text x="418" y="289" font-size="11">Unitary mixer</text>
</svg>
