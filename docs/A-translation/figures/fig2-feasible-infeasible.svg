<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="serif" font-size="12">
  <rect width="520" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker>
  </defs>
  <line x1="30" y1="280" x2="30" y2="20" stroke="#000" marker-end="url(#a)"/>
  <line x1="30" y1="280" x2="500" y2="280" stroke="#000"/>
  <text x="14" y="150" transform="rotate(-90 14 150)" text-anchor="middle">Objective value</text>

  <rect x="60" y="105" width="60" height="175" fill="#b3b3ff" stroke="#00f"/>
  <text x="90" y="190" text-anchor="middle">All</text>
  <text x="90" y="204" text-anchor="middle">solutions</text>
  <text x="145" y="195" text-anchor="middle" font-size="20">=</text>

  <rect x="170" y="130" width="60" height="105" fill="#b3dbb3" stroke="#080"/>
  <text x="200" y="178" text-anchor="middle">Feasible</text>
  <text x="200" y="192" text-anchor="middle">solutions</text>
  <text x="258" y="195" text-anchor="middle" font-size="20">+</text>

  <rect x="285" y="105" width="60" height="175" fill="#ffb3b3" stroke="#c00"/>
  <text x="315" y="190" text-anchor="middle">Infeasible</text>
  <text x="315" y="204" text-anchor="middle">solutions</text>

  <line x1="345" y1="280" x2="450" y2="280" stroke="#c00" stroke-dasharray="4 3"/>
  <rect x="420" y="30" width="60" height="140" fill="#ffb3b3" stroke="#c00"/>
  <text x="450" y="88" text-anchor="middle">Penalized</text>
  <text x="450" y="102" text-anchor="middle">infeasible</text>
  <text x="450" y="116" text-anchor="middle">solutions</text>
  <line x1="450" y1="280" x2="450" y2="172" stroke="#000" marker-end="url(#a)"/>
  <text x="458" y="232">Penalty</text>
</svg>
